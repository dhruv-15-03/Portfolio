name: CI

# `pull_request` deliberately carries NO `branches:` filter.
#
# It used to read `pull_request: branches: [main]`, which meant a PR whose base
# was anything other than main fired zero workflows -- no test, no build, no
# resume-pdf. Stacked PRs (a branch based on another in-review branch) are
# exactly that case, so every stacked layer merged completely unverified, past
# the drift gate this file exists to enforce. Caught when a stacked PR showed a
# green tick from Vercel alone and had to be routed through a throwaway
# main-targeting PR to get any real signal.
#
# `push` stays filtered to main on purpose: PR runs already cover branch work,
# so an unfiltered push trigger would only double every run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI=true is already set by GitHub Actions, but it is declared explicitly
      # here so the gate cannot be silently weakened: react-scripts appends
      # --watch only when CI is unset and no --watchAll flag is passed.
      - name: Run tests
        run: npm test -- --watchAll=false
        env:
          CI: true

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CI=true is deliberate. Under CRA 5 it promotes ESLint warnings to build
      # errors. Do not set CI=false to make this job pass -- that turns a broken
      # build green and defeats the purpose of the gate.
      - name: Build
        run: npm run build
        env:
          CI: true

  # Guards against the resume PDFs under public/resume/ drifting from their
  # source of truth. A CGPA correction once landed in the React source while
  # the served PDFs kept the old value, so the downloadable PDF contradicted
  # the page linking to it.
  #
  # Two kinds of PDF (see tools/check-resume-pdf-drift.js):
  #   - PINNED in resume/pdf-manifest.json (the approved 1-page CVs served
  #     today): checked by SHA-256 and page count.
  #   - GENERATED from resume/*.md by tools/build-resume-pdf.js: checked by
  #     EXTRACTED TEXT, not bytes. Headless Chrome embeds a fresh document ID
  #     per render, so two renders of identical input measured the same length
  #     and a different SHA256 every time -- a byte check would fail
  #     permanently. Extracted text measured hash-identical across renders.
  # Every served PDF is also scanned for the manifest's "bannedClaims"
  # (unverified metrics removed from the site).
  resume-pdf:
    name: resume-pdf
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # pdftotext does the text extraction both sides of the comparison are
      # built from. Same binary, same run, so extractor version cannot skew it.
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # ubuntu-latest normally ships Chrome preinstalled; install it only if it
      # is absent so the job does not break when the runner image changes.
      # Only the GENERATED path (resume/*.md) needs Chrome.
      - name: Ensure Chrome is available
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "Using preinstalled: $(command -v google-chrome)"
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            echo "Using preinstalled: $(command -v google-chrome-stable)"
          else
            echo "Chrome not found on runner, installing."
            wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
            rm google-chrome-stable_current_amd64.deb
          fi
          google-chrome --version

      - name: Install dependencies
        run: npm ci

      # Fails when a served PDF does not match its source (pinned SHA-256 or
      # regenerated markdown), has no source, or contains a banned claim. To
      # replace a pinned CV, update resume/pdf-manifest.json in the same commit;
      # never edit the banned list or resume content just to make this pass.
      - name: Check resume PDFs match their source of truth
        run: node tools/check-resume-pdf-drift.js
        env:
          CI: true
